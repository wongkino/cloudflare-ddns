<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloudflare DDNS Updater Status Page</title>
  <link rel="stylesheet" href="/styles.css?v=8">
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>Cloudflare DDNS Updater Status Page</h1>
      </div>
      <div class="lang" id="lang" role="group" aria-label="語言">
        <button type="button" data-lang="zh-Hant" aria-pressed="true">繁體</button>
        <button type="button" data-lang="zh-Hans" aria-pressed="false">简体</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </header>
    <p class="live"><span class="dot" id="dot"></span><span id="live">讀取中</span></p>
    <section class="metrics" id="metrics"></section>
    <section>
      <h2 id="records-title">監視中的紀錄</h2>
      <div id="zones"></div>
    </section>
    <section>
      <h2 id="history-title">更換紀錄</h2>
      <div id="history"></div>
    </section>
  </main>
  <script src="/app.js?v=8"></script>
</body>
</html>
