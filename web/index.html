<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloudflare DDNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f2f5;
  --surface: #ffffff;
  --ink: #1d1f2a;
  --mute: #6b7280;
  --line: #d9dde5;
  --head: #e8eaef;
  --orange: #F6821F;
  --orange-soft: #fff1e3;
  --grey-cloud: #6b7280;
  --ok: #0e8a57;
  font-family: Inter, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--bg);
}

.signal {
  height: 3px;
  background: var(--orange);
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  width: min(980px, 100%);
  margin: 0 auto;
  padding:
    12px max(14px, env(safe-area-inset-right))
    12px max(14px, env(safe-area-inset-left));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-sq {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  background: var(--orange);
  flex-shrink: 0;
}

h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 0 9px;
  border-radius: 4px;
  background: var(--orange-soft);
  color: var(--orange);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.live.wait {
  background: #eef0f3;
  color: var(--mute);
}

.live .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.lang {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
}

.lang button {
  min-height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--mute);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.lang button:last-child { border-right: 0; }

.lang button:first-child { border-radius: 5px 0 0 5px; }
.lang button:last-child { border-radius: 0 5px 5px 0; }

.lang button[aria-pressed="true"] {
  background: var(--orange);
  color: #fff;
}

.lang button:focus-visible,
button:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
  position: relative;
  z-index: 1;
}

.lang button[aria-pressed="true"]:focus-visible {
  outline-color: var(--ink);
}

main {
  width: min(980px, 100%);
  margin: 0 auto;
  padding:
    14px max(12px, env(safe-area-inset-right))
    calc(36px + env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}

.meta-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}

.meta {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
}

.meta dt {
  margin: 0 0 4px;
  color: var(--mute);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.meta dd {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.meta dd.ok { color: var(--ok); }
.meta dd.proxied { color: var(--orange); }

.board {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 12px;
}

.board-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--head);
}

.board-h h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
}

.addr-line {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}

.addr-line .lbl {
  color: var(--mute);
  font-weight: 600;
  margin-right: 6px;
}

.addr-line .val {
  font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.table-wrap { overflow-x: auto; }

table.dns {
  width: 100%;
  border-collapse: collapse;
  min-width: 560px;
}

table.dns th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--mute);
  background: #f7f8fa;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

table.dns td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  vertical-align: middle;
}

table.dns tr:last-child td { border-bottom: 0; }

table.dns .zone-row td {
  background: #fafbfc;
  font-weight: 700;
  font-size: 12px;
  color: var(--mute);
  letter-spacing: 0.02em;
  padding-top: 8px;
  padding-bottom: 8px;
}

.type-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 48px;
  height: 22px;
  padding: 0 8px;
  border-radius: 3px;
  background: var(--ink);
  color: #fff;
  font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 600;
}

.type-badge.aaaa {
  background: #3b4252;
}

.name-cell {
  font-weight: 500;
  overflow-wrap: anywhere;
}

.content-cell {
  font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 12px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.proxy-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.proxy-pill.dns {
  background: #eef0f3;
  color: var(--grey-cloud);
}

.proxy-pill.proxied {
  background: var(--orange-soft);
  color: var(--orange);
}

.proxy-pill .cloud-ico {
  width: 14px;
  height: 9px;
  border-radius: 50% 50% 42% 42%;
  background: currentColor;
  position: relative;
  flex-shrink: 0;
}

.proxy-pill.proxied .cloud-ico {
  box-shadow: 0 0 0 1px rgba(246, 130, 31, 0.2);
}

.history-list { padding: 0; }

.change {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 10px;
  align-items: start;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

.change:last-child { border-bottom: 0; }

.change .type-badge { margin-top: 2px; }

.change .body { min-width: 0; }

.change .name {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  overflow-wrap: anywhere;
}

.delta {
  margin: 0;
  font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.delta b { font-weight: 600; }

.when {
  color: var(--mute);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
}

.empty {
  margin: 0;
  padding: 18px 14px;
  color: var(--mute);
  font-size: 13px;
}

#hero-kicker { display: none; }

@media (max-width: 640px) {
  .meta-strip { grid-template-columns: 1fr; }
  .change {
    grid-template-columns: 48px 1fr;
  }
  .when {
    grid-column: 2;
    text-align: left;
    white-space: normal;
  }
}

@media (prefers-reduced-motion: reduce) {
  .live .dot { transition: none; }
}
</style>
</head>
<body>
<div class="signal" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-sq" aria-hidden="true"></span>
      <h1>Cloudflare DDNS</h1>
      <span class="live wait" id="live"><span class="dot" aria-hidden="true"></span><span id="mode">讀取中</span></span>
    </div>
    <div class="lang" id="lang" role="group">
      <button type="button" data-lang="zh-Hant" aria-pressed="true">繁體</button>
      <button type="button" data-lang="zh-Hans" aria-pressed="false">简体</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
</header>

<main>
  <p id="hero-kicker">讀取中</p>
  <dl class="meta-strip">
    <div class="meta">
      <dt id="mode-label">狀況</dt>
      <dd id="mode-metric">讀取中</dd>
    </div>
    <div class="meta">
      <dt id="cloud-label">雲朵</dt>
      <dd id="cloud">—</dd>
    </div>
    <div class="meta">
      <dt id="checked-label">上次核對</dt>
      <dd id="checked">—</dd>
    </div>
  </dl>

  <section class="board" aria-labelledby="records-title">
    <div class="board-h">
      <h2 id="records-title">監視中的紀錄</h2>
    </div>
    <div class="addr-line" id="addresses" aria-live="polite"></div>
    <div class="table-wrap">
      <table class="dns" aria-labelledby="records-title">
        <thead>
          <tr>
            <th scope="col">Type</th>
            <th scope="col">Name</th>
            <th scope="col">Content</th>
            <th scope="col">Proxy status</th>
          </tr>
        </thead>
        <tbody id="zones"></tbody>
      </table>
    </div>
  </section>

  <section class="board" aria-labelledby="history-title">
    <div class="board-h"><h2 id="history-title">更換紀錄</h2></div>
    <div class="history-list" id="history"></div>
  </section>
</main>
<script>
const COPY = {
  "zh-Hant": {
    group: "語言",
    loading: "讀取中",
    dryRun: "演練",
    running: "運作中",
    notStarted: "尚未開始",
    proxied: "橙雲",
    dnsOnly: "灰雲",
    state: "狀況",
    cloud: "雲朵",
    checked: "上次核對",
    now: "目前公網",
    ipv4: "目前公網 IPv4",
    ipv6: "目前公網 IPv6",
    notChecked: "尚未核對",
    records: "監視中的紀錄",
    history: "更換紀錄",
    newRecord: "新紀錄",
    noAddress: "這個 zone 沒有可顯示的位址",
    noZone: "尚未設定 zone",
    noHistory: "還沒有更換紀錄",
  },
  "zh-Hans": {
    group: "语言",
    loading: "读取中",
    dryRun: "演练",
    running: "运行中",
    notStarted: "尚未开始",
    proxied: "橙云",
    dnsOnly: "灰云",
    state: "状况",
    cloud: "云朵",
    checked: "上次核对",
    now: "当前公网",
    ipv4: "当前公网 IPv4",
    ipv6: "当前公网 IPv6",
    notChecked: "尚未核对",
    records: "监视中的记录",
    history: "更换记录",
    newRecord: "新记录",
    noAddress: "这个 zone 没有可显示的地址",
    noZone: "尚未设定 zone",
    noHistory: "还没有更换记录",
  },
  en: {
    group: "Language",
    loading: "Loading",
    dryRun: "Dry run",
    running: "Running",
    notStarted: "Not started",
    proxied: "Proxied",
    dnsOnly: "DNS only",
    state: "Status",
    cloud: "Cloud",
    checked: "Last check",
    now: "Public address",
    ipv4: "Public IPv4",
    ipv6: "Public IPv6",
    notChecked: "Not checked yet",
    records: "Watched records",
    history: "Changes",
    newRecord: "New record",
    noAddress: "This zone has no address to show",
    noZone: "No zone configured",
    noHistory: "No changes yet",
  },
};

const kicker = document.querySelector("#hero-kicker");
const addressesEl = document.querySelector("#addresses");
const liveEl = document.querySelector("#live");
const modeEl = document.querySelector("#mode");
const modeMetric = document.querySelector("#mode-metric");
const cloudEl = document.querySelector("#cloud");
const checkedEl = document.querySelector("#checked");
const zonesEl = document.querySelector("#zones");
const historyEl = document.querySelector("#history");
const lang = document.querySelector("#lang");
let language = "zh-Hant";
let current = null;

function t(key) { return COPY[language][key]; }
function text(value) { return String(value ?? ""); }
function escapeHtml(value) {
  return text(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}
function clock(value) {
  if (!value) return t("notChecked");
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  const pad = (part) => String(part).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function ip(value) {
  return escapeHtml(value).replaceAll(":", ":<wbr>");
}
function before(value) {
  return value ? ip(value) : escapeHtml(t("newRecord"));
}
function badge(kind) {
  const mark = kind === "AAAA" ? " aaaa" : "";
  return `<span class="type-badge${mark}">${escapeHtml(kind)}</span>`;
}

function applyLanguage(next) {
  language = COPY[next] ? next : "zh-Hant";
  try { localStorage.setItem("cloudflare-ddns-lang", language); } catch (_) {}
  document.documentElement.lang = language;
  lang.setAttribute("aria-label", t("group"));
  for (const button of lang.querySelectorAll("button")) {
    button.setAttribute("aria-pressed", String(button.dataset.lang === language));
  }
  document.querySelector("#records-title").textContent = t("records");
  document.querySelector("#history-title").textContent = t("history");
  document.querySelector("#mode-label").textContent = t("state");
  document.querySelector("#cloud-label").textContent = t("cloud");
  document.querySelector("#checked-label").textContent = t("checked");
  if (current) render(current);
  else {
    kicker.textContent = t("loading");
    modeEl.textContent = t("loading");
    modeMetric.textContent = t("loading");
  }
}

function render(data) {
  current = data;
  const types = data.types && data.types.length ? data.types : ["A", "AAAA"];
  const addresses = data.addresses || {};
  const cloud = data.proxied ? t("proxied") : t("dnsOnly");
  const live = Boolean(data.watching) && !data.dry_run;
  liveEl.classList.toggle("wait", !live);
  const statusText = data.dry_run ? t("dryRun") : data.watching ? t("running") : t("notStarted");
  modeEl.textContent = live ? "LIVE" : statusText;
  modeMetric.textContent = statusText;
  modeMetric.classList.toggle("ok", Boolean(data.watching) && !data.dry_run);
  cloudEl.textContent = cloud;
  cloudEl.classList.toggle("proxied", Boolean(data.proxied));
  checkedEl.textContent = data.updated_at ? clock(data.updated_at) : t("notChecked");
  kicker.textContent = types.length === 1 ? (types[0] === "A" ? t("ipv4") : t("ipv6")) : t("now");
  addressesEl.innerHTML = types.map((kind) => {
    const shown = addresses[kind] ? ip(addresses[kind]) : escapeHtml(t("notChecked"));
    const label = kind === "A" ? t("ipv4") : t("ipv6");
    return `<span><span class="lbl">${escapeHtml(label)}</span><span class="val">${shown}</span></span>`;
  }).join("");
  const proxyClass = data.proxied ? "proxied" : "dns";
  const zones = data.zones || [];
  if (!zones.length) {
    zonesEl.innerHTML = `<tr><td colspan="4" class="empty">${escapeHtml(t("noZone"))}</td></tr>`;
  } else {
    zonesEl.innerHTML = zones.map((zone) => {
      const names = zone.names || [];
      const rows = names.length
        ? names.flatMap((name) => types.map((kind) => `
          <tr>
            <td>${badge(kind)}</td>
            <td class="name-cell">${escapeHtml(name)}</td>
            <td class="content-cell">${addresses[kind] ? ip(addresses[kind]) : escapeHtml(t("notChecked"))}</td>
            <td><span class="proxy-pill ${proxyClass}"><span class="cloud-ico" aria-hidden="true"></span>${escapeHtml(cloud)}</span></td>
          </tr>`)).join("")
        : `<tr><td colspan="4" class="empty">${escapeHtml(t("noAddress"))}</td></tr>`;
      return `<tr class="zone-row"><td colspan="4">${escapeHtml(zone.domain)}</td></tr>${rows}`;
    }).join("");
  }
  const items = data.history || [];
  historyEl.innerHTML = items.length
    ? items.map((item) => `
      <div class="change">
        ${badge(item.type)}
        <div class="body">
          <div class="name">${escapeHtml(item.name)}</div>
          <p class="delta"><b>${before(item.before)}</b> → <b>${ip(item.after)}</b></p>
        </div>
        <div class="when">${escapeHtml(clock(item.at))}</div>
      </div>`).join("")
    : `<p class="empty">${escapeHtml(t("noHistory"))}</p>`;
}

lang.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  applyLanguage(button.dataset.lang);
});

async function load() {
  const response = await fetch("/api/status", { cache: "no-store" });
  render(await response.json());
}

applyLanguage((() => { try { return localStorage.getItem("cloudflare-ddns-lang"); } catch (_) { return null; } })() || "zh-Hant");
load();
setInterval(load, 5000);
</script>
</body>
</html>
