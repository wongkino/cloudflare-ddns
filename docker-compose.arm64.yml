services:
  cloudflare-ddns:
    image: ghcr.io/wongkino/cloudflare-ddns:arm64
    pull_policy: always
    container_name: cloudflare-ddns
    restart: unless-stopped
    # 使用主機網路，容器才看得到這台機器的公網 IPv4 與 IPv6。
    # Host networking, so the container sees this machine's public IPv4 and IPv6.
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ZONE_ID: ""
      # 單一 zone。多個 zone 用 docker-compose.multi.yml，並把 image 改成 arm64。
      # One zone. For several zones, use docker-compose.multi.yml and set image to arm64.
      DOMAIN: example.com
      # @ 是這個 zone 的根網域。
      # @ is this zone's apex.
      A_RECORDS: "@"
      # A、AAAA，或 A,AAAA。
      RECORD_TYPES: "A,AAAA"
      INTERVAL_SECONDS: "30"
      RECHECK_SECONDS: "3600"
      DNS_TTL: "60"
      # true 為橙雲。預設灰雲。
      # true proxies through Cloudflare. The default is DNS-only.
      CF_PROXIED: "false"
      DRY_RUN: "false"
      # true 才開啟狀態頁。
      # Set true to open the status page.
      WEB_UI: "false"
      # 狀態頁走主機網路，不要另加 ports。WEB_UI 為 false 時這個連接埠不會開啟。
      # The status page uses the host network; do not add ports.
      # This port stays closed while WEB_UI is false.
      WEB_PORT: "8080"
      # 多個網址以空白分隔。可填 Apprise 網址，或 https://主機/notify/token。
      # Separate multiple URLs with spaces. Use an Apprise URL, or https://host/notify/token.
      APPRISE_URLS: ""
