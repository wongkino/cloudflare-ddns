services:
  cloudflare-ddns:
    image: ghcr.io/wongkino/cloudflare-ddns:amd64
    pull_policy: always
    container_name: cloudflare-ddns
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ZONE_ID: ""
      DOMAIN: example.com
      # 逗號分隔。@ 代表根網域。每個名稱都會更新 A 與 AAAA。
      # Comma-separated. @ is the zone apex. Each name gets both an A and an AAAA record.
      A_RECORDS: "@"
      INTERVAL_SECONDS: "30"
      DNS_TTL: "60"
      DRY_RUN: "false"
      # 多個網址以空白分隔。可填 Apprise 網址，或 https://主機/notify/token。
      # Separate multiple URLs with spaces. Use an Apprise URL, or https://host/notify/token.
      APPRISE_URLS: ""
