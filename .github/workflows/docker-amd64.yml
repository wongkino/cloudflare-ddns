name: Build image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 映像架構。amd64 給一般電腦，arm64 給 64-bit Raspberry Pi。
        required: false
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
      version:
        description: 版本號，例如 2.0.0。留空則自動把這個架構現有最大版本的 patch 加一。
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/wongkino/cloudflare-ddns

jobs:
  image:
    name: linux/${{ inputs.platform }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: inputs.platform == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.platform }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          requested = os.environ.get("VERSION", "").strip()
          arch = os.environ.get("ARCH", "amd64").strip() or "amd64"
          suffix = "" if arch == "amd64" else f"-{arch}"
          pattern = re.compile(r"^v?[0-9]+(\.[0-9]+){1,2}(-[A-Za-z0-9.]+)?$")
          stable = re.compile(
              rf"^v?(?P<major>[0-9]+)\.(?P<minor>[0-9]+)\.(?P<patch>[0-9]+){re.escape(suffix)}$"
          )

          def emit(version, note):
              print(note)
              path = os.environ["GITHUB_OUTPUT"]
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(f"version={version}\n")

          if requested:
              if not pattern.match(requested):
                  raise SystemExit(f"版本號須像 1.2.0 或 v1.2.0，目前是：{requested}")
              if suffix and not requested.endswith(suffix):
                  requested = f"{requested}{suffix}"
              emit(requested, f"使用指定版本 {requested}")
              raise SystemExit(0)

          basic = base64.b64encode(
              f"{os.environ['GH_ACTOR']}:{os.environ['GH_TOKEN']}".encode()
          ).decode()
          query = urllib.parse.urlencode(
              {
                  "service": "ghcr.io",
                  "scope": "repository:wongkino/cloudflare-ddns:pull",
              }
          )
          token_request = urllib.request.Request(
              f"https://ghcr.io/token?{query}",
              headers={"Authorization": f"Basic {basic}"},
          )
          try:
              with urllib.request.urlopen(token_request, timeout=30) as response:
                  granted = json.load(response)
          except urllib.error.HTTPError as error:
              detail = error.read().decode()[:300]
              raise SystemExit(f"取得 GHCR token 失敗 ({error.code}): {detail}")
          access = granted.get("token") or granted.get("access_token")
          if not access:
              raise SystemExit("GHCR 沒有回傳 token")
          request = urllib.request.Request(
              "https://ghcr.io/v2/wongkino/cloudflare-ddns/tags/list?n=1000",
              headers={"Authorization": f"Bearer {access}"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  emit(f"1.0.0{suffix}", f"沒有舊映像，版本為 1.0.0{suffix}")
                  raise SystemExit(0)
              detail = error.read().decode()[:300]
              raise SystemExit(f"讀取映像標籤失敗 ({error.code}): {detail}")

          found = []
          for tag in payload.get("tags") or []:
              match = stable.match(tag)
              if match:
                  found.append(tuple(int(match.group(name)) for name in ("major", "minor", "patch")))
          if not found:
              emit(f"1.0.0{suffix}", f"沒有既有版本標籤，版本為 1.0.0{suffix}")
              raise SystemExit(0)
          major, minor, patch = max(found)
          version = f"{major}.{minor}.{patch + 1}{suffix}"
          emit(version, f"自動版本 {version}")
          PY

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.platform }}
            type=sha,prefix=${{ inputs.platform }}-
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ inputs.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.platform }}
